name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate HTML
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          echo "All required files are present."

      - name: Build Application
        run: |
          mkdir -p build
          cp index.html build/
          cp style.css build/
          cp script.js build/
          echo "Build completed successfully."

      - name: Run Tests
        run: |
          test -s build/index.html
          echo "Basic application test passed."

      - name: Generate Build Log
        run: |
          echo "CI Pipeline completed successfully."
          echo "Build time: $(date)"

      - name: Send Success Notification
        if: success()
        run: |
          curl -X POST \
            -H "Content-type: application/json" \
            --data '{"text":"✅ CI Pipeline SUCCESS: devops-webapp build completed successfully."}' \
            "${{ secrets.SLACK_WEBHOOK_URL }}"

      - name: Send Failure Notification
        if: failure()
        run: |
          curl -X POST \
            -H "Content-type: application/json" \
            --data '{"text":"❌ CI Pipeline FAILED: devops-webapp build failed. Check GitHub Actions logs."}' \
            "${{ secrets.SLACK_WEBHOOK_URL }}"